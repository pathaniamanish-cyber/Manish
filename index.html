<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://cdn.jsdelivr.net blob:; worker-src 'self' blob: https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; connect-src 'self' https://sheets.googleapis.com https://www.googleapis.com https://oauth2.googleapis.com https://api.frankfurter.dev https://cdn.jsdelivr.net data: blob:; img-src 'self' data: blob:; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="theme-color" content="#141533">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Manish Money">
<meta name="description" content="Private expense and income manager">
<title>Manish Expense Manager</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="boot" class="boot"><img src="icon-192.png" alt="" width="96" height="96"><div class="boot-name">Manish Expense Manager</div><div class="spinner"></div></div>
<div id="app" hidden>
  <nav id="nav" aria-label="Accounts"></nav>
  <div id="main">
    <header id="top"></header>
    <div id="banner"></div>
    <main id="view" tabindex="-1"></main>
  </div>
</div>
<div id="sheet" class="overlay" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div></div>
<div id="listen" class="overlay listen" hidden></div>
<div id="dialog" class="overlay" hidden><div class="dialog" role="alertdialog" aria-modal="true"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="config.js"></script>
<script src="parser.js"></script>
<script src="rates.js"></script>
<script src="store.js"></script>
<script src="app.js"></script>
</body>
</html>
